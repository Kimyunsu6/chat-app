<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>채팅방</title>
	<style>
		body {
			font-family: sans-serif;
			max-width: 600px;
			margin: 0 auto;
			padding: 16px;
		}

		form {
			display: flex;
			gap: 8px;
		}

		input {
			flex: 1;
			min-width: 0;
			padding: 8px;
			font-size: 16px;
		}

		button {
			padding: 8px 16px;
			font-size: 16px;
		}

		#auth-form {
			flex-direction: column;
		}

		#auth-buttons {
			display: flex;
			gap: 8px;
		}

		#auth-buttons button {
			flex: 1;
		}

		#user-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 8px;
		}

		#auth-error {
			color: #c00;
		}

		#messages {
			height: 400px;
			overflow-y: auto;
			border: 1px solid #ccc;
			border-radius: 4px;
			padding: 8px;
			margin-bottom: 8px;
		}

		#messages p {
			margin: 4px 0;
			overflow-wrap: anywhere;
		}

		.notice {
			color: #666;
		}

		.hidden {
			display: none !important;
		}
	</style>
</head>
<body>
	<h1 id="title">채팅방</h1>

	<!-- 로그인한 사람 이름과 로그아웃 버튼 (로그인하면 보임) -->
	<div id="user-bar" class="hidden">
		<span id="user-name"></span>
		<button id="logout-button" type="button">로그아웃</button>
	</div>

	<!-- 로그인 / 회원가입 화면 (로그인 안 했을 때) -->
	<form id="auth-form" class="hidden">
		<input id="username-input" placeholder="아이디 (영문·숫자·_ 3~20자)" maxlength="20" autocomplete="username" required>
		<input id="password-input" type="password" placeholder="비밀번호 (8자 이상)" maxlength="100" autocomplete="current-password" required>
		<div id="auth-buttons">
			<button type="submit">로그인</button>
			<button id="signup-button" type="button">회원가입</button>
		</div>
		<p id="auth-error"></p>
	</form>

	<!-- 방 고르기 화면 (주소가 / 일 때) -->
	<form id="room-form" class="hidden">
		<input id="room-input" placeholder="방 이름 (예: 축구)" maxlength="20" required>
		<button type="submit">방으로 가기</button>
	</form>

	<!-- 채팅 화면 -->
	<div id="chat-screen" class="hidden">
		<div id="messages"></div>
		<form id="message-form">
			<input id="message-input" placeholder="메시지 입력" maxlength="1000" autocomplete="off" required>
			<button type="submit">보내기</button>
		</form>
	</div>

	<script>
		const title = document.getElementById("title");

		const userBar = document.getElementById("user-bar");
		const userName = document.getElementById("user-name");
		const logoutButton = document.getElementById("logout-button");

		const authForm = document.getElementById("auth-form");
		const usernameInput = document.getElementById("username-input");
		const passwordInput = document.getElementById("password-input");
		const signupButton = document.getElementById("signup-button");
		const authError = document.getElementById("auth-error");

		const roomForm = document.getElementById("room-form");
		const roomInput = document.getElementById("room-input");

		const chatScreen = document.getElementById("chat-screen");
		const messages = document.getElementById("messages");
		const messageForm = document.getElementById("message-form");
		const messageInput = document.getElementById("message-input");

		let socket = null;

		// 주소에서 방 이름을 꺼낸다. (예: /room/축구 → "축구")
		// 주소에 한글은 %EC%B6%95... 처럼 바뀌어 있어서 decodeURIComponent로 되돌린다.
		let roomName = "";
		if (location.pathname.startsWith("/room/")) {
			try {
				roomName = decodeURIComponent(location.pathname.slice("/room/".length)).trim();
			} catch (error) {
				roomName = "";
			}
		}
		if (roomName.length > 20) {
			roomName = "";
		}

		if (roomName !== "") {
			title.textContent = roomName + " 방";
			document.title = roomName + " 방";
		}

		// 메시지 한 줄을 화면에 추가한다.
		// textContent를 쓰면 누가 HTML 코드를 보내도 글자로만 보여서 안전하다.
		function addLine(text, className) {
			const line = document.createElement("p");
			line.textContent = text;
			line.className = className;
			messages.appendChild(line);
			messages.scrollTop = messages.scrollHeight;
		}

		// 로그인 안 했을 때: 로그인 화면만 보여준다.
		function showLogin() {
			authForm.classList.remove("hidden");
			usernameInput.focus();
		}

		// 로그인했을 때: 이름과 로그아웃 버튼을 보여주고, 방 고르기 또는 채팅방 접속
		function showApp(username) {
			authForm.classList.add("hidden");
			userBar.classList.remove("hidden");
			userName.textContent = username + " 님";

			if (roomName === "") {
				roomForm.classList.remove("hidden");
				roomInput.focus();
			} else {
				connect(username);
			}
		}

		// 페이지를 열면 먼저 로그인했는지 서버에 물어본다.
		async function start() {
			const response = await fetch("/api/me");
			if (response.ok) {
				const data = await response.json();
				showApp(data.username);
			} else {
				showLogin();
			}
		}

		// 로그인 또는 회원가입 요청을 보낸다. (path는 "/api/login" 또는 "/api/signup")
		async function sendAuth(path) {
			const username = usernameInput.value.trim();
			const password = passwordInput.value;
			if (username === "" || password === "") {
				authError.textContent = "아이디와 비밀번호를 입력해 주세요.";
				return;
			}

			authError.textContent = "";
			const response = await fetch(path, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ username: username, password: password }),
			});
			const data = await response.json();

			if (response.ok) {
				passwordInput.value = "";
				showApp(data.username);
			} else {
				authError.textContent = data.error;
			}
		}

		// 로그인 버튼 (엔터를 눌러도 여기로 온다)
		authForm.addEventListener("submit", function (event) {
			event.preventDefault();
			sendAuth("/api/login");
		});

		// 회원가입 버튼
		signupButton.addEventListener("click", function () {
			sendAuth("/api/signup");
		});

		// 로그아웃 버튼
		logoutButton.addEventListener("click", async function () {
			await fetch("/api/logout", { method: "POST" });
			if (socket !== null) {
				socket.close();
			}
			location.href = "/";
		});

		// 방으로 가기 버튼을 눌렀을 때
		roomForm.addEventListener("submit", function (event) {
			event.preventDefault();

			const name = roomInput.value.trim();
			if (name === "") {
				return;
			}

			location.href = "/room/" + encodeURIComponent(name);
		});

		// 채팅방에 접속한다. 이름은 서버가 쿠키를 보고 정하므로 주소에 넣지 않는다.
		function connect(username) {
			// https 주소에서는 wss, http 주소에서는 ws를 쓴다.
			let protocol = "ws:";
			if (location.protocol === "https:") {
				protocol = "wss:";
			}
			const address = protocol + "//" + location.host + "/ws?room=" + encodeURIComponent(roomName);

			socket = new WebSocket(address);

			socket.addEventListener("open", function () {
				chatScreen.classList.remove("hidden");
				addLine(username + " 님으로 입장했어요. (최근 메시지 50개까지 보여요)", "notice");
				messageInput.focus();
			});

			// 서버에서 메시지가 왔을 때
			socket.addEventListener("message", function (event) {
				const data = JSON.parse(event.data);
				addLine(data.nickname + ": " + data.text, "");
			});

			socket.addEventListener("close", function () {
				chatScreen.classList.remove("hidden");
				addLine("연결이 끊어졌어요. 새로고침해서 다시 입장해 주세요.", "notice");
			});
		}

		// 보내기 버튼을 눌렀을 때
		messageForm.addEventListener("submit", function (event) {
			event.preventDefault();

			const text = messageInput.value.trim();
			if (text === "" || socket === null || socket.readyState !== WebSocket.OPEN) {
				return;
			}

			socket.send(text);
			messageInput.value = "";
			messageInput.focus();
		});

		start();
	</script>
</body>
</html>
