<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>채팅방</title>
	<style>
		body {
			font-family: sans-serif;
			max-width: 600px;
			margin: 0 auto;
			padding: 16px;
		}

		form {
			display: flex;
			gap: 8px;
		}

		input {
			flex: 1;
			min-width: 0;
			padding: 8px;
			font-size: 16px;
		}

		button {
			padding: 8px 16px;
			font-size: 16px;
		}

		#auth-form {
			flex-direction: column;
		}

		#auth-buttons {
			display: flex;
			gap: 8px;
		}

		#auth-buttons button {
			flex: 1;
		}

		#user-bar {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 8px;
		}

		#auth-error {
			color: #c00;
		}

		#messages {
			height: 400px;
			overflow-y: auto;
			border: 1px solid #ccc;
			border-radius: 4px;
			padding: 8px;
			margin-bottom: 8px;
		}

		#messages p {
			margin: 4px 0;
			overflow-wrap: anywhere;
		}

		.notice {
			color: #666;
		}

		#friends-screen {
			margin-top: 16px;
		}

		#friends-screen h2 {
			font-size: 18px;
			margin: 16px 0 8px;
		}

		#friends-screen li {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 4px 0;
			overflow-wrap: anywhere;
		}

		#friends-screen ul {
			list-style: none;
			padding: 0;
			margin: 0;
		}

		#friend-message {
			margin: 8px 0;
		}

		#group-friend-list label {
			display: flex;
			gap: 8px;
			align-items: center;
		}

		#group-friend-list input {
			flex: none;
		}

		#home-link {
			display: inline-block;
			margin-bottom: 8px;
		}

		.hidden {
			display: none !important;
		}
	</style>
</head>
<body>
	<h1 id="title">채팅방</h1>

	<!-- 로그인한 사람 이름과 로그아웃 버튼 (로그인하면 보임) -->
	<div id="user-bar" class="hidden">
		<span id="user-name"></span>
		<button id="logout-button" type="button">로그아웃</button>
	</div>

	<!-- 로그인 / 회원가입 화면 (로그인 안 했을 때) -->
	<form id="auth-form" class="hidden">
		<input id="username-input" placeholder="아이디 (영문·숫자·_ 3~20자)" maxlength="20" autocomplete="username" required>
		<input id="password-input" type="password" placeholder="비밀번호 (8자 이상)" maxlength="100" autocomplete="current-password" required>
		<div id="auth-buttons">
			<button type="submit">로그인</button>
			<button id="signup-button" type="button">회원가입</button>
		</div>
		<p id="auth-error"></p>
	</form>

	<!-- 채팅방에서 첫 화면으로 돌아가는 링크 -->
	<a id="home-link" class="hidden" href="/">← 목록으로</a>

	<!-- 첫 화면 (주소가 / 일 때) -->
	<div id="friends-screen" class="hidden">
		<h2>내 채팅방</h2>
		<ul id="conversation-list"></ul>

		<h2>친구 추가</h2>
		<form id="friend-form">
			<input id="friend-input" placeholder="친구 아이디" maxlength="20" autocomplete="off" required>
			<button type="submit">신청</button>
		</form>
		<p id="friend-message"></p>

		<h2>받은 신청</h2>
		<ul id="request-list"></ul>

		<h2>친구 목록</h2>
		<ul id="friend-list"></ul>

		<h2>단톡방 만들기</h2>
		<ul id="group-friend-list"></ul>
		<form id="group-form">
			<input id="group-name-input" placeholder="단톡방 이름" maxlength="20" autocomplete="off" required>
			<button type="submit">만들기</button>
		</form>
		<p id="group-message"></p>

		<p><button id="friends-refresh-button" type="button">새로고침</button></p>
	</div>

	<!-- 채팅 화면 -->
	<div id="chat-screen" class="hidden">
		<div id="messages"></div>
		<form id="message-form">
			<input id="message-input" placeholder="메시지 입력" maxlength="1000" autocomplete="off" required>
			<button type="submit">보내기</button>
		</form>
	</div>

	<script>
		const title = document.getElementById("title");

		const userBar = document.getElementById("user-bar");
		const userName = document.getElementById("user-name");
		const logoutButton = document.getElementById("logout-button");

		const authForm = document.getElementById("auth-form");
		const usernameInput = document.getElementById("username-input");
		const passwordInput = document.getElementById("password-input");
		const signupButton = document.getElementById("signup-button");
		const authError = document.getElementById("auth-error");

		const homeLink = document.getElementById("home-link");
		const conversationList = document.getElementById("conversation-list");
		const groupFriendList = document.getElementById("group-friend-list");
		const groupForm = document.getElementById("group-form");
		const groupNameInput = document.getElementById("group-name-input");
		const groupMessage = document.getElementById("group-message");

		const friendsScreen = document.getElementById("friends-screen");
		const friendForm = document.getElementById("friend-form");
		const friendInput = document.getElementById("friend-input");
		const friendMessage = document.getElementById("friend-message");
		const requestList = document.getElementById("request-list");
		const friendList = document.getElementById("friend-list");
		const friendsRefreshButton = document.getElementById("friends-refresh-button");

		const chatScreen = document.getElementById("chat-screen");
		const messages = document.getElementById("messages");
		const messageForm = document.getElementById("message-form");
		const messageInput = document.getElementById("message-input");

		let socket = null;

		// 주소에서 방 번호를 꺼낸다. (예: /chat/12 → "12")
		let conversationId = "";
		if (location.pathname.startsWith("/chat/")) {
			const value = location.pathname.slice("/chat/".length);
			if (/^[0-9]+$/.test(value)) {
				conversationId = value;
			}
		}

		// 메시지 한 줄을 화면에 추가한다.
		// textContent를 쓰면 누가 HTML 코드를 보내도 글자로만 보여서 안전하다.
		function addLine(text, className) {
			const line = document.createElement("p");
			line.textContent = text;
			line.className = className;
			messages.appendChild(line);
			messages.scrollTop = messages.scrollHeight;
		}

		// 로그인 안 했을 때: 로그인 화면만 보여준다.
		function showLogin() {
			authForm.classList.remove("hidden");
			usernameInput.focus();
		}

		// 방 제목을 받아 오고, 멤버가 맞으면 채팅방에 접속한다.
		async function openConversation(username) {
			homeLink.classList.remove("hidden");

			const response = await fetch("/api/conversation?id=" + encodeURIComponent(conversationId));
			if (!response.ok) {
				title.textContent = "들어갈 수 없는 방이에요";
				return;
			}

			const data = await response.json();
			title.textContent = data.title;
			document.title = data.title;
			connect(username);
		}

		// 로그인했을 때: 이름과 로그아웃 버튼을 보여주고, 첫 화면 또는 채팅방을 연다.
		function showApp(username) {
			authForm.classList.add("hidden");
			userBar.classList.remove("hidden");
			userName.textContent = username + " 님";

			if (conversationId === "") {
				friendsScreen.classList.remove("hidden");
				loadConversations();
				loadFriends();
			} else {
				openConversation(username);
			}
		}

		// 페이지를 열면 먼저 로그인했는지 서버에 물어본다.
		async function start() {
			// /room/축구 같은 옛 주소나 잘못된 주소는 첫 화면으로 보낸다.
			if (location.pathname !== "/" && conversationId === "") {
				location.replace("/");
				return;
			}

			const response = await fetch("/api/me");
			if (response.ok) {
				const data = await response.json();
				showApp(data.username);
			} else {
				showLogin();
			}
		}

		// 로그인 또는 회원가입 요청을 보낸다. (path는 "/api/login" 또는 "/api/signup")
		async function sendAuth(path) {
			const username = usernameInput.value.trim();
			const password = passwordInput.value;
			if (username === "" || password === "") {
				authError.textContent = "아이디와 비밀번호를 입력해 주세요.";
				return;
			}

			authError.textContent = "";
			const response = await fetch(path, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ username: username, password: password }),
			});
			const data = await response.json();

			if (response.ok) {
				passwordInput.value = "";
				showApp(data.username);
			} else {
				authError.textContent = data.error;
			}
		}

		// 로그인 버튼 (엔터를 눌러도 여기로 온다)
		authForm.addEventListener("submit", function (event) {
			event.preventDefault();
			sendAuth("/api/login");
		});

		// 회원가입 버튼
		signupButton.addEventListener("click", function () {
			sendAuth("/api/signup");
		});

		// 로그아웃 버튼
		logoutButton.addEventListener("click", async function () {
			await fetch("/api/logout", { method: "POST" });
			if (socket !== null) {
				socket.close();
			}
			location.href = "/";
		});

		// 목록이 비었을 때 안내 문구를 한 줄 넣는다.
		function addEmptyLine(list, text) {
			const item = document.createElement("li");
			item.textContent = text;
			item.className = "notice";
			list.appendChild(item);
		}

		// 받은 신청과 친구 목록을 서버에서 받아서 화면에 그린다.
		async function loadFriends() {
			const requestsResponse = await fetch("/api/friends/requests");
			const friendsResponse = await fetch("/api/friends");
			if (!requestsResponse.ok || !friendsResponse.ok) {
				friendMessage.textContent = "목록을 불러오지 못했어요. 다시 로그인해 주세요.";
				return;
			}

			const requestsData = await requestsResponse.json();
			const friendsData = await friendsResponse.json();

			// 받은 신청 그리기
			requestList.textContent = "";
			if (requestsData.requests.length === 0) {
				addEmptyLine(requestList, "받은 신청이 없어요.");
			}
			for (const request of requestsData.requests) {
				const item = document.createElement("li");

				const name = document.createElement("span");
				name.textContent = request.username;
				item.appendChild(name);

				const button = document.createElement("button");
				button.type = "button";
				button.textContent = "수락";
				button.addEventListener("click", function () {
					acceptRequest(request.id);
				});
				item.appendChild(button);

				requestList.appendChild(item);
			}

			// 친구 목록 그리기
			friendList.textContent = "";
			groupFriendList.textContent = "";
			if (friendsData.friends.length === 0) {
				addEmptyLine(friendList, "아직 친구가 없어요.");
				addEmptyLine(groupFriendList, "친구가 생기면 고를 수 있어요.");
			}
			for (const friend of friendsData.friends) {
				// 이름을 누르면 1:1 방으로 들어간다.
				const item = document.createElement("li");
				const button = document.createElement("button");
				button.type = "button";
				button.textContent = friend.username;
				button.addEventListener("click", function () {
					openDm(friend.username);
				});
				item.appendChild(button);
				friendList.appendChild(item);

				// 단톡방에 넣을 친구를 고르는 체크박스
				const groupItem = document.createElement("li");
				const label = document.createElement("label");
				const checkbox = document.createElement("input");
				checkbox.type = "checkbox";
				checkbox.value = friend.username;
				label.appendChild(checkbox);
				label.appendChild(document.createTextNode(friend.username));
				groupItem.appendChild(label);
				groupFriendList.appendChild(groupItem);
			}
		}

		// 내가 들어가 있는 방 목록을 그린다. (서버가 최근 메시지 순서로 준다)
		async function loadConversations() {
			const response = await fetch("/api/conversations");
			if (!response.ok) {
				return;
			}

			const data = await response.json();
			conversationList.textContent = "";
			if (data.conversations.length === 0) {
				addEmptyLine(conversationList, "아직 채팅방이 없어요.");
			}
			for (const conversation of data.conversations) {
				const item = document.createElement("li");
				const link = document.createElement("a");
				link.href = "/chat/" + conversation.id;
				link.textContent = conversation.title;
				item.appendChild(link);

				const kind = document.createElement("span");
				kind.className = "notice";
				if (conversation.type === "group") {
					kind.textContent = "단톡";
				} else {
					kind.textContent = "1:1";
				}
				item.appendChild(kind);

				conversationList.appendChild(item);
			}
		}

		// 친구와의 1:1 방으로 들어간다. (같은 두 사람은 항상 같은 방)
		async function openDm(username) {
			const response = await fetch("/api/dm", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ username: username }),
			});
			const data = await response.json();

			if (response.ok) {
				location.href = "/chat/" + data.id;
			} else {
				friendMessage.textContent = data.error;
			}
		}

		// 단톡방 만들기 버튼을 눌렀을 때
		groupForm.addEventListener("submit", async function (event) {
			event.preventDefault();

			const usernames = [];
			const checkboxes = groupFriendList.querySelectorAll("input:checked");
			for (const checkbox of checkboxes) {
				usernames.push(checkbox.value);
			}

			const response = await fetch("/api/groups", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ name: groupNameInput.value.trim(), usernames: usernames }),
			});
			const data = await response.json();

			if (response.ok) {
				location.href = "/chat/" + data.id;
			} else {
				groupMessage.textContent = data.error;
			}
		});

		// 친구 신청을 수락한다.
		async function acceptRequest(id) {
			const response = await fetch("/api/friends/accept", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ id: id }),
			});
			const data = await response.json();

			if (response.ok) {
				friendMessage.textContent = "친구가 되었어요.";
			} else {
				friendMessage.textContent = data.error;
			}
			loadFriends();
		}

		// 친구 신청 버튼을 눌렀을 때
		friendForm.addEventListener("submit", async function (event) {
			event.preventDefault();

			const username = friendInput.value.trim();
			if (username === "") {
				return;
			}

			const response = await fetch("/api/friends/request", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ username: username }),
			});
			const data = await response.json();

			if (response.ok) {
				friendInput.value = "";
				friendMessage.textContent = username + " 님에게 신청했어요.";
			} else {
				friendMessage.textContent = data.error;
			}
		});

		// 새로고침 버튼: 상대가 수락했는지 다시 확인한다.
		friendsRefreshButton.addEventListener("click", function () {
			friendMessage.textContent = "";
			loadConversations();
			loadFriends();
		});

		// 채팅방에 접속한다. 이름은 서버가 쿠키를 보고 정하므로 주소에 넣지 않는다.
		function connect(username) {
			// https 주소에서는 wss, http 주소에서는 ws를 쓴다.
			let protocol = "ws:";
			if (location.protocol === "https:") {
				protocol = "wss:";
			}
			const address = protocol + "//" + location.host + "/ws?conversation=" + encodeURIComponent(conversationId);

			socket = new WebSocket(address);

			socket.addEventListener("open", function () {
				chatScreen.classList.remove("hidden");
				addLine(username + " 님으로 입장했어요. (최근 메시지 50개까지 보여요)", "notice");
				messageInput.focus();
			});

			// 서버에서 메시지가 왔을 때
			socket.addEventListener("message", function (event) {
				const data = JSON.parse(event.data);
				addLine(data.nickname + ": " + data.text, "");
			});

			socket.addEventListener("close", function () {
				chatScreen.classList.remove("hidden");
				addLine("연결이 끊어졌어요. 새로고침해서 다시 입장해 주세요.", "notice");
			});
		}

		// 보내기 버튼을 눌렀을 때
		messageForm.addEventListener("submit", function (event) {
			event.preventDefault();

			const text = messageInput.value.trim();
			if (text === "" || socket === null || socket.readyState !== WebSocket.OPEN) {
				return;
			}

			socket.send(text);
			messageInput.value = "";
			messageInput.focus();
		});

		start();
	</script>
</body>
</html>
